[project]
name = "insightbot"
version = "0.1.0"
description = "Multi-agent data analyst built with Microsoft AutoGen (classic 0.2 API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyautogen==0.2.35",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = ["jupyter", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightbot"]
